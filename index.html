<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juan Carlos Alvarado | Data & Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: '#3b82f6', // Blue 500
              secondary: '#0ea5e9', // Sky 500
              accent: '#6366f1', // Indigo 500
              dark: '#020617', // Slate 950
              odoo: '#714B67',
            },
            animation: {
              'blob': 'blob 7s infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'dash': 'dash 4s linear infinite',
              'pipeline-flow': 'pipelineFlow 3s ease-in-out infinite',
              'code-type': 'codeType 2s steps(4) infinite alternate',
              'cursor-blink': 'cursorBlink 1s step-end infinite',
              'grow-bar': 'growBar 3s ease-out infinite',
              'pulse-db': 'pulseDB 3s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              dash: {
                '0%': { strokeDashoffset: '100' },
                '100%': { strokeDashoffset: '0' },
              },
              // Pipeline Animations
              pipelineFlow: {
                '0%': { strokeDashoffset: '1000' },
                '100%': { strokeDashoffset: '0' }
              },
              codeType: {
                '0%': { width: '0%', opacity: 0.5 },
                '100%': { width: '100%', opacity: 1 }
              },
              cursorBlink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' }
              },
              growBar: {
                '0%, 20%': { transform: 'scaleY(0)' },
                '40%, 100%': { transform: 'scaleY(1)' }
              },
              pulseDB: {
                '0%, 20%': { fillOpacity: '0.1', stroke: '#1e293b' },
                '25%, 35%': { fillOpacity: '0.3', stroke: '#3b82f6' }, // Flash blue
                '100%': { fillOpacity: '0.1', stroke: '#1e293b' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      
      /* Subtle Grid Background for Hero */
      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-dark text-slate-300 font-sans antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
